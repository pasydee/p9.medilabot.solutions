<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Pay My Buddy</title>

    <!-- Bootstrap 5 CDN -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-white">

<!--
    CONTENEUR PRINCIPAL
    -------------------
    - Centre le formulaire verticalement et horizontalement
    - Largeur fixe pour un rendu propre
-->
<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="p-4 shadow-sm"
         style="width: 350px; border: 2px solid black;">

        <!--
            LOGO / TITRE
            ------------
            - Bouton stylisé affichant le nom de l'application
        -->
        <section class="text-center mb-5">
            <button class="btn"
                    style="background-color: orange; color: white; font-weight: bold;">
                Pay My Buddy
            </button>
        </section>

        <!--
            MESSAGE D'ERREUR
            -----------------
            - Affiché uniquement si Spring Security renvoie ?error
            - Message : Email ou mot de passe invalide
        -->
        <div th:if="${param.error}" class="alert alert-danger">
            Email ou mot de passe invalide.
        </div>

        <!--
            FORMULAIRE DE CONNEXION
            ------------------------
            - Champs : email + mot de passe
            - Envoi vers POST /login (Spring Security)
        -->
        <form th:action="@{/login}" method="post">

            <input type="email"
                   class="form-control mb-3"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   class="form-control mb-5"
                   name="password"
                   placeholder="Mot de passe"
                   required>

            <section class="text-center mb-4">
                <button type="submit" class="btn btn-primary">
                    Se connecter
                </button>
            </section>
        </form>

        <!--
            LIEN D'INSCRIPTION
            -------------------
            - Redirige vers /register
        -->
        <div class="text-center">
            <span>Pas encore de compte ? </span>
            <a href="/register" class="fw-bold" style="color: blue;">S'inscrire</a>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
